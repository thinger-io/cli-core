name: 'publish'

on:
    push:
        branches: [main, develop]

jobs:
    publish:
        name: publish
        runs-on: ubuntu-latest

        # Trusted Publishing to npm: GitHub mints a short-lived OIDC token,
        # npm verifies it against the publisher configured for this package,
        # and no long-lived NPM_TOKEN has to live in GitHub secrets.
        # Also required for the `--provenance` attestation below.
        permissions:
            id-token: write
            contents: write

        steps:
            - name: Extract branch name
              shell: bash
              run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

            - name: checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ env.branch }}

            - name: node
              uses: actions/setup-node@v5
              with:
                  # Node 24 ships npm >= 11.5, needed for Trusted Publishing
                  # and the `--provenance` attestation below.
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: install dependencies
              run: npm ci

            # Never publish a build that fails its own checks.
            - name: check
              run: npm run lint && npm run typecheck && npm test

            - name: Get tag version
              run: |
                  echo "tag_version=`cat package.json | jq '.version' | tr -d '"'`"  >> $GITHUB_ENV

            - name: Check if tag is for develop and if it already exists
              run: |
                  git fetch --prune --tags
                  if [ ${{ env.branch }} == 'develop' ]; then
                      for i in {1..100}; do
                          if [ `git tag --list | grep ${{ env.tag_version }}"-alpha.${i}" | wc -l` -eq 0 ]; then
                              tag_version=${{ env.tag_version }}"-alpha.${i}"
                              echo "tag_version=${tag_version}" >> $GITHUB_ENV
                              echo "npm_tag_version=develop" >> $GITHUB_ENV
                              break;
                          fi
                      done
                  elif [ ${{ env.branch }} == 'main' ]; then
                      echo "npm_tag_version=latest" >> $GITHUB_ENV
                  elif [ `git tag --list | grep -q ${{ env.tag_version }}` -ne 0 ]; then exit 1; fi

            - name: update version
              run: |
                  npm version --no-git-tag-version --allow-same-version ${{ env.tag_version }}

            - name: publish
              run: npm publish --provenance --tag ${{ env.npm_tag_version }} --access public

            - name: Get changelog body
              run: |
                  awk '/^## \[[0-9]+/,EOF' CHANGELOG.md | awk '(NR>1)' | awk '1;/^## \[[0-9]+/{exit}' | sed '$d' > release_body.md

            - name: Set pre-release boolean
              run: |
                  prerelease=false
                  if [ ${{ env.branch }} == 'develop' ]; then
                      prerelease=true
                  fi
                  echo "prerelease=$prerelease" >> $GITHUB_ENV

            - name: Create GitHub release
              uses: ncipollo/release-action@v1
              with:
                  prerelease: ${{ env.prerelease }}
                  commit: ${{ env.branch }}
                  tag: ${{ env.tag_version }}
                  name: ${{ env.tag_version }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  bodyFile: 'release_body.md'
